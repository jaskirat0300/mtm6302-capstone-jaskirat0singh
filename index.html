<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedex</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">Pokedex</div>
        <nav>
            <ul>
                <li id="nav-home">Home</li>
                <li id="nav-caught">Caught Pokémon</li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="pokemon-gallery">
            <h1>Pokémon Gallery</h1>
            <div id="pokemon-container" class="grid"></div>
            <button class="load-more">Load More...</button>
        </section>

        <section id="pokemon-detail" class="hidden">
            <img src="" alt="Pokemon Image" class="pokemon-img">
            <h1>Pokemon Name</h1>
            <p><strong>Abilities:</strong> <span id="abilities"></span></p>
            <p><strong>Types:</strong> <span id="types"></span></p>
            <p><strong>Caught:</strong> <span id="caught-status">No</span></p>
            <div class="button-group">
                <button id="back-btn">Back</button>
                <button id="toggle-caught-btn">Toggle Caught</button>
            </div>
        </section>

        <section id="caught-pokemon" class="hidden">
            <h1>Caught Pokémon</h1>
            <div id="caught-container" class="grid"></div>
            <button id="back-to-gallery">Back to Gallery</button>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
